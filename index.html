<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoulouBoost - Arrivée imminente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fdfdfd; }
        .bg-custom { background-color: #4A5548; }
    </style>
</head>
<body class="h-screen flex items-center justify-center p-6 text-center">
    <div class="max-w-md">
        <!-- Ton Logo -->
        <div class="w-24 h-24 mx-auto mb-8 rounded-full border-2 border-gray-100 shadow-lg overflow-hidden bg-white">
            <img src="logo.png" alt="LoulouBoost" class="w-full h-full object-cover">
        </div>

        <h1 class="text-4xl font-extrabold mb-4" style="color: #4A5548;">LoulouBoost se refait <span style="color: #E9664D;" class="italic">une beauté</span>.</h1>
        
        <p class="text-gray-500 mb-8 leading-relaxed">
            On peaufine les derniers réglages pour vous offrir une expérience de boost optimale. Revenez très vite !
        </p>

        <!-- Petit bandeau discret -->
        <div class="inline-block px-6 py-2 rounded-full text-sm font-bold bg-[#f8f6f2] text-[#4A5548] border border-[#4A5548]/10">
            ✨ Ouverture prochaine
        </div>

        <!-- Réseaux Sociaux (Optionnel) -->
        <div class="mt-12 text-xs text-gray-400 uppercase tracking-widest font-bold">
            Suivez l'avancée sur Instagram
        </div>
    </div>
</body>
</html>
